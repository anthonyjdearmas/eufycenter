<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eufy Camera Mode Toggle</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center">
        <div class="text-center">
            <!-- Status Header -->
            <div class="status-header mb-4">
                <h2 class="text-white mb-3">Eufy Camera System</h2>
                <div id="connectionStatus" class="connection-status">
                    <i class="bi bi-circle-fill text-secondary"></i>
                    <span class="text-white ms-2">Checking connection...</span>
                </div>
            </div>

            <!-- Main Toggle Button -->
            <div class="toggle-container">
                <button id="cameraToggle" class="camera-toggle-btn" disabled>
                    <div class="toggle-content">
                        <div class="toggle-icon">
                            <i class="bi bi-camera-video"></i>
                        </div>
                        <div class="toggle-text">
                            <div class="toggle-title">Camera Mode</div>
                            <div id="toggleStatus" class="toggle-subtitle">Loading...</div>
                        </div>
                        <div class="toggle-switch">
                            <div class="switch-track">
                                <div class="switch-thumb"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Loading Overlay -->
                    <div id="loadingOverlay" class="loading-overlay d-none">
                        <div class="spinner-border text-light" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <div class="loading-text mt-2">Toggling cameras...</div>
                    </div>
                </button>
            </div>

            <!-- Camera List (collapsible) -->
            <div class="mt-4">
                <button id="toggleCameraList" class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#cameraList">
                    <i class="bi bi-list"></i> Show Camera Details
                </button>
                <div id="cameraList" class="collapse mt-3">
                    <div class="card bg-dark bg-opacity-75 border-0 text-white">
                        <div class="card-body">
                            <div id="cameraDetails" class="camera-details">
                                <!-- Camera details will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
